debug_mode: true
wait_time: 5
timeout: 300
server_evaluation_timeout: 15
download_retries: 3
retry_backoff: 2
verify_ssl: false
allow_redirects: false

user_agent: Mozilla/5.0 (X11; Linux x86_64; rv:60.0) Gecko/20100101 Firefox/60.0
storage_path: C:\TEMP\ScriptedBookDownloads
database_file: books.sqlite
logstamp_format: "%(message)s"

target_formats:
  - epub
  - azw3
  - mobi
  - azw4
  - azw
  - kfx

proxy:
  enabled: false
  proxies:
    - protocol: http
      address: ""
      port: 0
      auth: false
      username: ""
      password: ""
    - protocol: https
      address: ""
      port: 0
      auth: false
      username: ""
      password: ""
