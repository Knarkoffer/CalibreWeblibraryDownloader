debug_mode: true
wait_time: 5
timeout: 300
server_evaluation_timeout: 15
download_retries: 3
retry_backoff: 2
max_consecutive_download_failures: 10
verify_ssl: false
allow_redirects: false

# Optional, default false. When true, loads all downloaded book metadata
# into memory and skips matching title/author/format/size records before
# download, even across different Calibre servers. This can use noticeably
# more memory with very large databases.
skip_global_metadata_duplicates: false

user_agent: Mozilla/5.0 (X11; Linux x86_64; rv:60.0) Gecko/20100101 Firefox/60.0
storage_path: C:\TEMP\ScriptedBookDownloads
database_file: books.sqlite
logstamp_format: "%(message)s"

# Optional log readability limits. log_book_author_limit shows the first N
# authors and then "X more" for long anthologies; set to 0 to show all authors.
# log_book_entry_max_length truncates long book-entry log messages; set to 0 to
# disable truncation.
log_book_author_limit: 3
log_book_entry_max_length: 180

target_formats:
  - epub
  - azw3
  - mobi
  - azw4
  - azw
  - kfx

proxy:
  enabled: false
  proxies:
    - protocol: http
      address: ""
      port: 0
      auth: false
      username: ""
      password: ""
    - protocol: https
      address: ""
      port: 0
      auth: false
      username: ""
      password: ""
