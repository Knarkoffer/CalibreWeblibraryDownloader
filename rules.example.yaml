rules:
  - name: Oversized books
    metadata: Size
    max_mb: 150
    wanted: false
  - name: Calibre guides
    metadata: Title
    regex: '^(Calibre Quick Start Guide|Quick Start Guide)$'
    wanted: false
  - name: Project Gutenberg books
    metadata: Identifier
    regex: '(?i)(^gutenberg:|gutenberg\.org/ebooks/)'
    wanted: false
  - name: Unwanted languages
    metadata: Language
    values:
      - Chinese
      - Spanish
      - Portuguese
    match: all
    wanted: false
  - name: Title does not contain any ASCII-characters
    metadata: Title
    regex: '^([^\x00-\x7F])+$'
    wanted: false
  - name: Lousy converted books
    metadata: Title
    regex: '(?i)(Microsoft Word - .*\.doc$|\.(doc|docx)$)'
    wanted: false
  - name: Unwanted authors
    metadata: Author
    regex: '(?i)^(Ruby Lionsdrake|Laurann Dohner)$'
    wanted: false
  - name: Unwanted titles
    metadata: Title
    regex: '(?i)^(Star Wars|Star Trek|Doctor Who:)'
    wanted: false
  - name: Unwanted tags
    metadata: Tags
    regex: '(?i)^(Star Wars|Star Trek)$'
    wanted: false
  - name: Unwanted series
    metadata: Series
    regex: '(?i)^(Star Wars|Star Trek)$'
    wanted: false
  - name: Abridged, no thank you
    metadata: Title
    regex: '(?i)(\(abridged)'
    wanted: false
